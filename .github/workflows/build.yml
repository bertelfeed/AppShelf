name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build, check and package
        shell: pwsh
        env:
          # Hosted runners have no user's foreground desktop. Keep the other native checks.
          APPSHELF_SKIP_FOREGROUND_CHECKS: '1'
          MSSTORE_PRODUCT_ID: ${{ vars.MSSTORE_PRODUCT_ID }}
        run: ./build.ps1 -Check -Package
      - name: Check Store integration without connecting
        shell: pwsh
        run: ./tools/check-store-integration.ps1
      - name: Upload portable preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AppShelf-win-x64
          path: |
            artifacts/AppShelf-*-win-x64.zip
            artifacts/AppShelf-*-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
