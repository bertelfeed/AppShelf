name: Website

# Publishes site/ to GitHub Pages: https://bertelfeed.github.io/AppShelf/
# Pushes publish while the repository variable SITE_ENABLED is true (Settings → Secrets and variables → Actions →
# Variables), with Settings → Pages → Source set to GitHub Actions. A manual run publishes regardless of the variable.

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: vars.SITE_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: site
      # Pages lets browsers keep files for 10 minutes; a new address per commit makes a new page load its own styles.
      - name: Version the stylesheet and script links
        run: sed -i -E "s#(assets/site\.(css|js))\"#\1?v=${GITHUB_SHA::7}\"#" site/index.html site/ru/index.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
