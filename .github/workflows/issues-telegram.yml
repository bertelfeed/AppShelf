name: Issues to Telegram

# Short notice in one Telegram chat when an Issue is opened or reopened.
# Setup and troubleshooting: docs/FEEDBACK_AUTOMATION.md.
# Issue text is read by the script from $GITHUB_EVENT_PATH and never placed in run: lines.

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issues-telegram
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 .github/scripts/issue_to_telegram.py
