<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 128 128">
  <!-- "Fan": a folder of four app tiles in front of two fanned plates (folders in folders).
       Rendered to AppShelf.ico by tools/make-app-icon.ps1; sizes up to 24 px drop the inner rim and use bigger tiles. -->
  <g transform="translate(5 1)">
    <rect x="10" y="22" width="84" height="84" rx="20" fill="#2EC4B6" transform="rotate(-16 52 64)"/>
    <rect x="20" y="20" width="84" height="84" rx="20" fill="#FF8A3D" transform="rotate(-7 62 62)"/>
    <g transform="translate(30 18) rotate(4 42 42)">
      <rect width="84" height="84" rx="20" fill="#5B5FC7"/>
      <rect x="6" y="6" width="72" height="72" rx="15" fill="#7376D6"/>
      <rect x="15" y="15" width="24" height="24" rx="7" fill="#FF8A3D"/>
      <rect x="45" y="15" width="24" height="24" rx="7" fill="#2EC4B6"/>
      <rect x="15" y="45" width="24" height="24" rx="7" fill="#FFD23F"/>
      <rect x="45" y="45" width="24" height="24" rx="7" fill="#F25F8A"/>
    </g>
  </g>
</svg>
